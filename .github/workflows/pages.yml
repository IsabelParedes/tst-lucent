name: Deploy Lucent Pages

on:
  push:
    branches: main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: env_wasm_build.yaml
          init-shell: bash

      - name: Pack wasm env (empack)
        shell: bash -l {0}
        run: |
          set -euo pipefail

          micromamba create -f env_wasm_run_simple.yaml -p ./_prefix-wasm \
            --platform=emscripten-wasm32

          chmod +x pack-empack.sh
          ./pack-empack.sh
          test -f packages/empack_env_meta.json
          test -f runtime/bin/Rmain.js
          test -f runtime/bin/Rmain.wasm

      - name: Build Lucent
        run: |
          npm ci --prefix lucent
          npm run build --prefix lucent

      - name: Assemble Pages tree
        run: |
          chmod +x prepare-pages.sh
          ./prepare-pages.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _pages

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
