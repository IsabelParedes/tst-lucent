<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shiny-Forge</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <main class="app-layout">
      <section class="editor-panel" aria-label="App source code">
        <div class="editor-toolbar">
          <label class="editor-label" for="app-code">webApp/app.R</label>
          <button type="button" id="run-button" class="run-button" aria-label="Run app">
            ▶
          </button>
        </div>
        <textarea
          id="app-code"
          class="editor-input"
          spellcheck="false"
        >
library(shiny)

ui <- fluidPage(
  titlePanel("Hello Shiny!"),
  sidebarLayout(
    sidebarPanel(
      numericInput(
        inputId = "num",
        label = "Number of observations",
        value = 500,
        min = 1,
        max = 1000
      )
    ),
    mainPanel(
      plotOutput("distPlot")
    )
  )
)

server <- function(input, output) {
  output$distPlot <- renderPlot({
    hist(rnorm(input$num))
  })
}

shinyApp(ui, server)
</textarea>
      </section>

      <section class="viewer-panel" aria-label="Viewer">
        <iframe
          id="app-frame"
          class="app-frame"
          title="Viewer"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
        ></iframe>
      </section>
    </main>
    <script type="module" src="runApp.js"></script>
  </body>
</html>
